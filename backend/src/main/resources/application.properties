spring.application.name=edureach
server.port=8080

# Optional local overrides: copy .env.example to .env (never commit .env)
spring.config.import=optional:file:.env[.properties]

# MySQL - the database is created automatically if it does not exist
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=edureach

# Hibernate creates and updates the tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (use a long random secret of at least 32 characters in real deployments)
app.jwt.secret=${JWT_SECRET:edureach-dev-secret-change-me-please-use-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
