spring.application.name=edureach
server.port=8080

# Optional local overrides: put your values in backend/.env (never commit .env)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL on Supabase (Session pooler). Set DB_URL, DB_USERNAME and DB_PASSWORD in .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=edureach

# Hibernate creates and updates the tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (use a long random secret of at least 32 characters in real deployments)
app.jwt.secret=${JWT_SECRET:edureach-dev-secret-change-me-please-use-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Code required to register an Admin account on the sign-up page
app.admin.signup-code=${ADMIN_SIGNUP_CODE:edureach-admin}

# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
